spring.application.name=ticketrush

```properties
spring.datasource.url=jdbc:postgresql://localhost:5433/ticketrush
spring.datasource.username=ticketrush
spring.datasource.password=ticketrush

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,prometheus

# Must be at least 32 characters. In production, set the JWT_SECRET environment variable.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-minimum-32-chars}
app.jwt.expiry-seconds=3600
```